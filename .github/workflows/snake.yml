name: Animate contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate matching light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#238f97&color_dots=#edf4f5,#b7dddf,#82c8cb,#4aafb4,#277e89
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8be7cd&color_dots=#13293a,#1e4858,#2b7582,#39a8a8,#80dbc4

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
